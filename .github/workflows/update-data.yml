name: Update stock data

on:
  schedule:
    # 平日 10:00 UTC (= 19:00 JST、東証大引け 15:00 JST の4時間後) に株価のみ更新
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        default: 'prices'
        type: choice
        options:
          - prices
          - full
          - irbank
          - irbank-force
          - summary
          - diag
      diag_code:
        description: 'diag用銘柄コード(例: 7723)'
        required: false
        default: '7723'
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub Actions max 360分
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update data (prices)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'prices'
        env:
          UPDATE_PRICES_ONLY: '1'
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: python scripts/update_data.py

      - name: Update data (full)
        if: github.event.inputs.mode == 'full'
        env:
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: python scripts/update_data.py

      - name: Update data (ir-bank enrich)
        if: github.event.inputs.mode == 'irbank'
        env:
          ENRICH_IRBANK: '1'
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: python scripts/update_data.py

      - name: Update data (ir-bank force re-enrich)
        if: github.event.inputs.mode == 'irbank-force'
        env:
          ENRICH_IRBANK: '1'
          FORCE_IRBANK: '1'
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: python scripts/update_data.py

      - name: Update data (business summary translation)
        if: github.event.inputs.mode == 'summary'
        env:
          ENRICH_SUMMARY: '1'
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: python scripts/update_data.py

      - name: Diagnose ir-bank page structure
        if: github.event.inputs.mode == 'diag'
        env:
          DIAG_IRBANK: ${{ github.event.inputs.diag_code }}
        run: python scripts/update_data.py

      - name: Record portfolio history
        if: github.event.inputs.mode != 'diag'
        run: python scripts/record_history.py

      - name: Commit and push changes
        if: github.event.inputs.mode != 'diag'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: update stock data ($(date -u +%Y-%m-%d))"
          # 長時間ジョブ中に別run(週次scheduleなど)が先に push しているとnon-fast-forwardで弾かれる。
          # その場合は origin/main を取り込んで、データファイルは ours (= 今書いたもの)を優先して rebase 再push。
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push成功 (attempt=$attempt)"
              exit 0
            fi
            echo "push reject (attempt=$attempt) → fetch & rebase --strategy-option=ours"
            git fetch origin main
            git rebase --strategy-option=ours origin/main || {
              echo "rebase失敗 (attempt=$attempt)"
              git rebase --abort || true
              sleep 5
              continue
            }
            sleep 5
          done
          echo "ERROR: 5回試行してもpushできませんでした"
          exit 1
